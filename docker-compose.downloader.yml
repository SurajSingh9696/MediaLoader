version: '3.9'
services:
  downloader:
    build:
      context: .
      dockerfile: Dockerfile.downloader
    container_name: medialoader-downloader
    ports:
      - "3000:3000"
    environment:
      ENABLE_EXTERNAL_DOWNLOADER_PROXY: "false"
      # Optional: set if yt-dlp is not in PATH for your image
      # YTDLP_PATH: "yt-dlp"
    restart: unless-stopped
